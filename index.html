<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>釜山媽咪姐妹行 🍓 口袋名單</title>
<style>
:root{
  /* 聖誕市集配色：夜晚松綠背景＋奶油色攤位卡片＋聖誕紅／金 */
  --bg:#14262b; --card:#fffaf0; --pink:#c8102e; --pink-soft:#fde6df; --peach:#fde0c9;
  --mint:#e1efdc; --sky:#d3e8d8; --lav:#f6d6d6; --yellow:#fbecb8;
  --text:#4a2c2a; --muted:#8a6f66; --line:#ecd9c6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:60px}
header{text-align:center;padding:26px 16px 16px;background:linear-gradient(180deg,var(--pink-soft),var(--bg))}
header .big{font-size:42px;letter-spacing:6px}
header h1{font-size:23px;margin:6px 0 4px}
header p{color:var(--muted);font-size:14px}
nav{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:none;background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);white-space:nowrap}
nav button.on{background:var(--pink);color:#fff;font-weight:700}
nav .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
main{max-width:720px;margin:0 auto;padding:14px}
.page{display:none}
.page.on{display:block}
.dayhead{border-radius:18px;padding:14px 16px;margin-bottom:12px}
.dayhead h2{font-size:20px}
.dayhead p{font-size:13px;color:var(--muted)}
.sub{font-size:15px;font-weight:700;margin:16px 4px 8px}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(255,143,171,.15);display:flex;gap:12px;align-items:flex-start;transition:opacity .2s}
.card.done{opacity:.5}
.card.done .name{text-decoration:line-through}
.emo{font-size:28px;flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pink-soft)}
.body{flex:1;min-width:0}
.name{font-weight:700;font-size:16px}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--yellow)}
.tag.eat{background:var(--peach)} .tag.buy{background:var(--lav)} .tag.day{background:var(--sky)}
.actions{display:flex;gap:8px;margin-top:9px;align-items:center}
.map{display:inline-block;text-decoration:none;background:var(--mint);color:inherit;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.map:active{transform:scale(.96)}
.chk{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--pink);width:18px;height:18px}
.top{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:6px;border:2px dashed var(--pink)}
.top h2{font-size:18px;margin-bottom:6px}
.top ul{list-style:none}
.top li{padding:6px 0;border-bottom:1px dotted var(--line);font-size:14px}
.top li:last-child{border:none}
.top small{color:var(--muted)}
.tip{background:var(--yellow);border-radius:14px;padding:10px 14px;font-size:13px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:14px;background:var(--card);border-radius:16px}
details.orig{background:var(--card);border-radius:14px;padding:10px 14px;margin-top:14px;font-size:13px}
details.orig summary{cursor:pointer;font-weight:700}
details.orig li{margin-left:18px}

/* 排行程 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{border:none;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;background:var(--pink);color:#fff}
.btn.alt{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.col{margin-bottom:16px;border-radius:18px;padding:10px;background:var(--card);box-shadow:0 2px 8px rgba(255,143,171,.12)}
.colhead{font-weight:800;font-size:15px;padding:4px 6px 8px;display:flex;justify-content:space-between;align-items:center}
.colhead .cnt{font-size:12px;font-weight:600;color:var(--muted)}
.list{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:6px}
.list:empty::before{content:"把店家拖到這裡 ✨";display:block;text-align:center;color:var(--muted);font-size:13px;padding:14px 0}
.pi{display:flex;align-items:center;gap:8px;background:var(--pink-soft);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px;touch-action:manipulation}
.pi .handle{cursor:grab;font-size:20px;padding:4px 6px;touch-action:none;color:var(--muted);user-select:none}
.pi .pe{font-size:20px}
.pi .pn{flex:1;min-width:0;font-weight:600;line-height:1.3}
.pi select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;font-size:12px;padding:4px 2px;max-width:84px}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 4px 14px rgba(255,143,171,.5)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}

/* ===== 聖誕市集風格覆蓋 ===== */
body{background:radial-gradient(ellipse at top,#1f4a45 0%,#14262b 55%,#0d1a1e 100%) fixed;color:#fdf3e3}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
header{position:relative;background:none;padding-top:46px;color:#fdf3e3}
header h1{font-family:"Noto Serif TC","Songti TC",serif;color:#ffd98a;text-shadow:0 2px 10px rgba(255,200,100,.45);letter-spacing:1px}
header p{color:#d9cbb2}
header .big{filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.lights{position:absolute;top:0;left:0;right:0;height:34px;list-style:none;display:flex;justify-content:space-around;overflow:hidden;padding:0}
.lights::before{content:"";position:absolute;left:-5%;right:-5%;top:2px;height:2px;background:#0a1417;border-radius:50%}
.lights li{position:relative;margin-top:6px;width:11px;height:17px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:twinkle 2s ease-in-out infinite}
.lights li:nth-child(4n+1){background:#ff4d5e;box-shadow:0 0 12px 3px rgba(255,77,94,.7)}
.lights li:nth-child(4n+2){background:#ffd24d;box-shadow:0 0 12px 3px rgba(255,210,77,.7)}
.lights li:nth-child(4n+3){background:#5ddc8a;box-shadow:0 0 12px 3px rgba(93,220,138,.65)}
.lights li:nth-child(4n){background:#6cc4ff;box-shadow:0 0 12px 3px rgba(108,196,255,.65)}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
nav{background:rgba(20,38,43,.94);border-bottom:1px solid #3b5a55;backdrop-filter:blur(6px)}
nav button{background:#fffaf0;color:var(--text)}
nav button.on{background:var(--pink);color:#fff;box-shadow:0 0 0 2px #ffd98a}
.dayhead,.card,.top,.tip,.empty,.col,details.orig{color:var(--text)}
.dayhead{border:2px solid rgba(255,217,138,.55);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.dayhead h2{font-family:"Noto Serif TC","Songti TC",serif}
.sub{color:#ffd98a;font-family:"Noto Serif TC","Songti TC",serif}
/* 攤位遮雨棚（紅白條紋） */
.card{position:relative;overflow:hidden;padding-top:19px;border:1px solid #ecd9c6;box-shadow:0 4px 14px rgba(0,0,0,.28),0 0 0 1px rgba(255,217,138,.25)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,#c8102e 0 14px,#fffaf0 14px 28px)}
.card::after{content:"";position:absolute;left:0;right:0;top:8px;height:4px;background:radial-gradient(circle at 7px 0,#c8102e 6px,transparent 7px) 0 0/14px 4px repeat-x;opacity:.9}
.emo{background:radial-gradient(circle,#fff 0%,#fde6df 100%);box-shadow:inset 0 0 0 2px #f0c9bd}
.map{background:#d6ebd2;border:1px solid #b6d6b0}
.top{border:2px dashed #c8102e}
.btn.alt{background:#fffaf0;color:var(--text)}
.col{border:1px solid #3b5a55}
.pi{background:#fde6df}
footer{color:#cdbfa8}
.sbox input{width:100%;border:2px solid #ffd98a;border-radius:999px;padding:11px 16px;font-size:16px;background:#fffaf0;color:var(--text);outline:none}
.sbox input:focus{box-shadow:0 0 0 3px rgba(255,217,138,.35)}
.chiplabel{font-size:13px;color:#d9cbb2;margin:12px 4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chipt{border:1px solid #3b5a55;background:rgba(255,250,240,.08);color:#fdf3e3;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chipt small{opacity:.7;margin-left:4px}
.chipt.on{background:#c8102e;border-color:#ffd98a;color:#fff;font-weight:700}
.rescount{font-size:13px;color:#d9cbb2;margin:10px 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.sm{padding:5px 12px;font-size:12px}
main{padding-top:18px;max-width:1000px}
/* 卡片改成「左圖右文」＋雙欄網格 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:6px}
.cards .card{margin-bottom:0}
.card{gap:12px;padding:19px 12px 12px;align-items:stretch}
.thumb{position:relative;flex:none;width:92px;height:92px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#fde6df,#ffd9a8);display:flex;align-items:center;justify-content:center;font-size:42px;align-self:flex-start}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .no{position:absolute;left:0;top:0;z-index:1;background:#1b1b1b;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:0 0 8px 0;letter-spacing:.5px}
.kr{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:6px;font-size:13px;font-weight:600}
.closed{background:#1b1b1b;color:#fff;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700}
.closed.warn{background:#c8102e}
.area{margin-left:auto;font-weight:700;font-size:13px}
.tag.src{background:#ffe3a3}
.intro{background:#fffaf0;color:var(--text);border:2px dashed #ffd98a;border-radius:16px;padding:12px 16px;margin-bottom:14px}
.intro b{font-size:15px}
.intro p{font-size:14px;line-height:1.85;margin-top:4px}
@media (max-width:380px){.thumb{width:76px;height:76px;font-size:34px}}
@media (prefers-reduced-motion: reduce){.lights li{animation:none}}
</style>
</head>

/* ========== 狀態：行程排列 ========== */
function defaultPlan(){
  const p={pool:[],1:[],2:[],3:[],4:[]};
  items.forEach((it,i)=>{ if(BACKUP.has(it.n) || !it.day) p.pool.push(i); else p[it.day].push(i); });
  // Day 1 順序：飯店放行李 → 汗蒸幕，其餘照原順序
  const first = ["海雲台華美達安可酒店","SPA LAND Centum City","Club D Oasis"].map(n=>nameIdx[n]);
  p[1] = first.concat(p[1].filter(i=>!first.includes(i)));
  return p;
}
function ser(p){ return KEYS.map(k=>p[k].join(".")).join("_"); }
function parse(s){
  try{
    const parts = s.split("_"); if(parts.length!==5) return null;
    const p={}, seen=new Set();
    KEYS.forEach((k,j)=>{
      p[k] = parts[j]===""?[]:parts[j].split(".").map(Number);
      p[k].forEach(i=>{ if(!Number.isInteger(i)||i<0||i>=items.length||seen.has(i)) throw 0; seen.add(i); });
    });
    items.forEach((_,i)=>{ if(!seen.has(i)) p.pool.push(i); });
    return p;
  }catch(e){ return null; }
}
let plan = null;
try{
  const m = location.hash.match(/#p=([\d._]*)/);
  if(m) plan = parse(m[1]);
  if(!plan){ const s = localStorage.getItem("busan-plan"); if(s) plan = parse(s); }
}catch(e){}
if(!plan) plan = defaultPlan();

let store = {};
try{ store = JSON.parse(localStorage.getItem("busan-done")||"{}"); }catch(e){}
function saveStore(){ try{ localStorage.setItem("busan-done", JSON.stringify(store)); }catch(e){} }
function savePlan(){ try{ localStorage.setItem("busan-plan", ser(plan)); }catch(e){} }

function labelOf(name){
  const i = nameIdx[name];
  for(const k of KEYS) if(plan[k].includes(i)) return k==="pool" ? "待選區" : "Day "+k;
  return "";
}

/* ========== 卡片 ========== */
function closedText(it){ return (it.closed && it.closed.length) ? "公休 週"+it.closed.map(n=>DOW[n]).join("・") : ""; }
function conflictOf(it){   // 目前排的那天剛好是公休日？
  if(!it.closed) return false;
  const i = nameIdx[it.n]; if(i===undefined) return false;
  for(const d of [1,2,3,4]) if(plan[d].includes(i)) return it.closed.includes(DAYDOW[d]);
  return false;
}
function card(it, label, num){
  const tags = (it.tags||[]).map(t=>`<span class="tag ${t.startsWith("必吃")?"eat":t.startsWith("必買")?"buy":""}">${t}</span>`).join("");
  const dl = label ? `<span class="tag day">${label}</span>` : "";
  const src = it.src ? `<span class="tag src">👍 ${it.src} 推薦</span>` : "";
  const warn = conflictOf(it), ct = closedText(it);
  const meta = (it.hrs||ct||it.area) ? `<div class="meta">${it.hrs?`<span>${it.hrs}</span>`:""}${ct?`<span class="closed${warn?" warn":""}">${ct}</span>`:""}${warn?`<span class="closed warn">⚠️ 排到公休日了</span>`:""}${it.area?`<span class="area">◆ ${it.area}</span>`:""}</div>` : "";
  const thumb = `<div class="thumb">${num?`<span class="no">${String(num).padStart(2,"0")}</span>`:""}${it.img?`<img src="${it.img}" alt="" loading="lazy" onerror="this.remove()">`:""}${it.e}</div>`;
  return `<div class="card ${store[it.n]?"done":""}" data-id="${it.n}">
    ${thumb}
    <div class="body">
      <div class="name">${it.n}${it.kr?`<span class="kr">${it.kr}</span>`:""}</div>
      <div class="desc">${it.d}</div>
      ${meta}
      ${(dl||src||tags)?`<div class="tags">${dl}${src}${tags}</div>`:""}
      <div class="actions">
        <a class="map" href="${gm(it.q)}" target="_blank" rel="noopener">📍 Google 地圖</a>
        <label class="chk"><input type="checkbox" ${store[it.n]?"checked":""}> 去過了</label>
      </div>
    </div></div>`;
}
const cards = html => `<div class="cards">${html}</div>`;
function topBox(title, arr){
  return `<div class="top"><h2>${title}</h2><ul>${arr.map(x=>`<li>${x[0]} <b>${x[1]}</b><br><small>${x[2]}</small></li>`).join("")}</ul></div>`;
}

/* ========== 各頁 ========== */
function dayPage(d){
  const D = days[d];
  const list = plan[d].map(i=>items[i]);
  return `<div class="dayhead" style="background:${D.color}"><h2>${D.title}</h2><p>共 ${list.length} 個行程（到「🧩 排行程」調整順序）</p></div><div class="intro"><b>🗺️ 今日推薦玩法</b><p>${INTRO[d]}</p></div>`
   + (list.length ? cards(list.map((it,k)=>card(it, it.t==="f"?"🍴 美食":"📍 景點", k+1)).join(""))
                  : `<div class="empty">這天還沒有行程，到「🧩 排行程」把店家拖進來吧 ✨</div>`);
}
function eatPage(){
  return `<div class="dayhead" style="background:var(--peach)"><h2>😋 必吃美食總整理</h2><p>依種類分類，並顯示目前排在哪一天</p></div>`
   + topBox("🌟 一定要吃的 8 樣", eatTop)
   + eatGroups.map(g=>`<div class="sub">${g.t}</div>`+cards(g.names.map((n,k)=>card(byName[n], labelOf(n), k+1)).join(""))).join("");
}
function buyPage(){
  return `<div class="dayhead" style="background:var(--lav)"><h2>🛍️ 必買清單總整理</h2><p>依品項分類，並顯示目前排在哪一天</p></div>`
   + topBox("🌟 必買重點", buyTop)
   + `<div class="tip">💡 草莓與零食建議留到最後一天再買，行李比較好整理。</div>`
   + buyGroups.map(g=>`<div class="sub">${g.t}</div>`+cards(g.refs.map((r,k)=>card(r, typeof r.day==="string" ? r.day : labelOf(r.n), k+1)).join(""))).join("");
}
function renderViews(){
  [1,2,3,4].forEach(d=>{ document.getElementById("p-d"+d).innerHTML = dayPage(d); });

/* ========== 排行程頁 ========== */
const colTitle = k => k==="pool" ? "📥 待選區（還沒決定的先放這）" : days[k].title;
function planItem(i, cur){
  const it = items[i];

}
function buildPlannerShell(){
  document.getElementById("p-plan").innerHTML =
   `<div class="dayhead" style="background:var(--pink-soft)"><h2>🧩 排行程</h2><p>按住 ☰ 拖曳，或用右邊「移到」選單換天；🍴 代表餐廳</p></div>
    <div class="toolbar">

function fillPlanner(){

  KEYS.forEach(k=>{

/* ========== 搜尋＋標籤 ========== */
const TAGDEFS = [
 {k:"烤肉",em:"🥓",re:/烤肉|五花|GoGi|Chopilsal|烤大腸|梅花|牛胸|烤豬/i},
 {k:"豬肉湯飯",em:"🍲",re:/湯飯/},
 {k:"麵食",em:"🍜",re:/密麵|冷麵|河粉/},
 {k:"炸雞",em:"🍗",re:/炸雞/},
 {k:"海鮮",em:"🦑",re:/章魚|明太魚/},
 {k:"小酌",em:"🍻",re:/酒館|喝酒|烤大腸/},
 {k:"咖啡甜點",em:"🥯",re:/咖啡|Coffee|甜點|貝果|大福|糖餅|蛋塔|費南雪|優格|冰淇淋|麵包/i},
 {k:"草莓",em:"🍓",re:/草莓/},
 {k:"市場小吃",em:"🍢",re:/市場|魚板|糖餅|BIFF/},
 {k:"購物",em:"🛍️",re:/逛街|Outlet|百貨|超市|Olive|香水|選物|必買|護手霜/,g:1},
 {k:"美妝香水",em:"💄",re:/Olive|香水|護手霜|TAMBURINS|GRANHAND|NONFICTION|保養/,g:1},
 {k:"汗蒸幕",em:"♨️",re:/汗蒸|SPA LAND|Club D/},
 {k:"燈飾夜景",em:"✨",re:/燈|光之祭典|聖誕/},
 {k:"海景散步",em:"🌊",re:/海邊|海水浴場|海景|海岸|公園|步道|銀杏|釜山塔|文化村/,g:1},
 {k:"體驗活動",em:"🛷",re:/滑車|Luge|水上樂園/},
 {k:"住宿",em:"🏨",re:/住宿/},
];
const TAGLIST = [["美食","🍴"],["景點","📍"],["必吃","😋"],["必買","🎁"]].concat(TAGDEFS.map(d=>[d.k,d.em])).concat([["宵夜","🌙"],["在地推薦","👍"]]);
const DAYTAGS = ["Day 1","Day 2","Day 3","Day 4","待選區"];
const entries = items.concat(Object.values(extra));
function computeTags(it){
  const g = it.t!=="f";
  const s = it.n+" "+it.d+" "+(it.tags||[]).join(" ");
  const out = [];
  TAGDEFS.forEach(d=>{ if(d.g && !g) return; if(d.re.test(s)) out.push(d.k); });
  if(typeof it.day==="number") out.push(g?"景點":"美食");
  if((it.tags||[]).some(t=>t.startsWith("必吃"))) out.push("必吃");
  if((it.tags||[]).some(t=>t.startsWith("必買")) || typeof it.day==="string") out.push("必買");
  if(/24 小時|凌晨/.test(s) || it.late) out.push("宵夜");
  if(it.src) out.push("在地推薦");
  return out;
}
entries.forEach(it=>{ it._tags = computeTags(it); });
function labelFor(it){ return typeof it.day==="string" ? it.day : labelOf(it.n); }
function tagsOf(it){
  const t = it._tags.slice();
  if(typeof it.day==="number"){ const l = labelOf(it.n); if(l) t.push(l); }
  return t;
}
let sel = new Set(), anyMode = true, qtext = "";
function matchEntry(it){
  const tg = tagsOf(it);
  if(sel.size){
    const arr = [...sel];
    const ok = anyMode ? arr.some(x=>tg.includes(x)) : arr.every(x=>tg.includes(x));
    if(!ok) return false;
  }
  if(qtext){
    const hay = (it.n+" "+(it.kr||"")+" "+(it.area||"")+" "+it.d+" "+(it.tags||[]).join(" ")+" "+it.q+" "+tg.join(" ")).toLowerCase();
    return qtext.split(/\s+/).every(w=>hay.includes(w));
  }
  return true;
}
function buildSearchShell(){
  document.getElementById("p-search").innerHTML =
   `<div class="sbox"><input id="q" type="search" placeholder="🔍 搜尋店名、餐點、地區…（例：烤肉、豬肉湯、購物）" autocomplete="off"></div><div id="srch-chips"></div><div id="srch-res"></div>`;
}
function renderSearch(){
  const chipsEl = document.getElementById("srch-chips"), resEl = document.getElementById("srch-res");
  if(!chipsEl || !resEl) return;
  const cnt = k => entries.filter(it=>tagsOf(it).includes(k)).length;
  const mk = (k,em) => {
    const n = cnt(k);
    if(!n && !sel.has(k)) return "";
    return `<button class="chipt ${sel.has(k)?"on":""}" data-tag="${k}">${em?em+" ":""}${k}<small>${n}</small></button>`;
  };
  chipsEl.innerHTML =
    `<div class="chiplabel">🏷️ 點標籤篩選（可多選）</div><div class="chips">${TAGLIST.map(x=>mk(x[0],x[1])).join("")}</div>`
   +`<div class="chiplabel">📅 依目前行程天數</div><div class="chips">${DAYTAGS.map(k=>mk(k,"")).join("")}</div>`;
  const list = entries.filter(matchEntry);
  resEl.innerHTML =
    `<div class="rescount"><span>找到 <b>${list.length}</b> 個</span>`
   +(sel.size>1 ? `<button class="btn alt sm" id="anyToggle">${anyMode?"符合任一標籤":"同時符合全部"}（點我切換）</button>` : "")
   +((sel.size||qtext) ? `<button class="btn alt sm" id="clearSel">清除篩選</button>` : "")
   +`</div>`
   +(list.length ? cards(list.map((it,k)=>card(it, labelFor(it), k+1)).join("")) : `<div class="empty">找不到符合的店家，換個關鍵字或標籤試試 🔎</div>`);
}

app.addEventListener("input",e=>{

app.addEventListener("click",e=>{

/* ========== 聖誕裝飾：燈串＋飄雪 ========== */
(function(){
  const ul = document.getElementById("lights");
  if(ul){
    const n = Math.ceil(innerWidth/34)+1;
    for(let i=0;i<n;i++){ const li=document.createElement("li"); li.style.animationDelay=(i%5*0.4)+"s"; ul.appendChild(li); }
  }
  const c = document.getElementById("snow");
  if(!c) return;
  const ctx = c.getContext("2d");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0, H=0, flakes=[];
  function size(){
    const r = window.devicePixelRatio||1;
    W = innerWidth; H = innerHeight;
    c.width = W*r; c.height = H*r;
    ctx.setTransform(r,0,0,r,0,0);
  }
  size();
  addEventListener("resize", size);
  const N = W<600 ? 45 : 85;
  for(let i=0;i<N;i++){
    flakes.push({x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*3, s:0.4+Math.random()*1.2, d:Math.random()*6.28});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    for(const f of flakes){
      if(!reduce){
        f.y += f.s; f.d += 0.01; f.x += Math.sin(f.d)*0.5;
        if(f.y > H+5){ f.y = -5; f.x = Math.random()*W; }
      }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
    }
    if(!reduce) requestAnimationFrame(draw);
  }
  draw();
})();
</script>
